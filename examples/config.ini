# Example for ~/.config/kaltstart/config.ini (mode 0600). All keys are
# described in docs/configuration.md. The credential ID and the salt are
# placeholders: "kaltstart init" and "kaltstart add-host" write real values.

[token main]
credential_id = RVhBTVBMRS1DUkVERU5USUFMLUlELW5vdC1hLXJlYWwtb25lLWRvLW5vdC11c2UtMDAwMA==

[host srv01]
host = srv01.example.net
port = 2222
identity = ~/.ssh/id_ed25519_unlock
known_hosts = ~/.ssh/known_hosts.initramfs
booted_port = 22
token = main
salt = RVhBTVBMRS1TQUxULW5vdC1yYW5kb20tMDAwMDAwMDA=
devices = /dev/disk/by-uuid/00112233-4455-6677-8899-aabbccddeeff
# For a server behind a jump host, which the workstation cannot probe:
; ssh_options = -J bastion.example.net
; probe = no
