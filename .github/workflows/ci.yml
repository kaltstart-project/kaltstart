# SPDX-License-Identifier: GPL-2.0-only
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}
    # The suite needs nothing but Python (standard library): the FIDO2 tools,
    # ssh and ssh-keygen are replaced by stubs, so neither a token nor a
    # server is involved.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      # Parse only: py_compile would leave a cache file next to the script.
      - name: Syntax check
        run: python -I -c "import ast; ast.parse(open('kaltstart', encoding='utf-8').read())"

      - name: Unit tests
        run: python -I -B -m unittest discover -s tests -v
